name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
      TODO_RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$TAG" = "v$VERSION"
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target "$TARGET"
      - name: Package executable and checksum
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="todo-${TAG#v}-$TARGET.tar.gz"
          tar -C "target/$TARGET/release" -czf "dist/$ARCHIVE" todo
          (cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: todo-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render Homebrew formula from release checksums
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["TAG"].removeprefix("v")
          formula = Path("packaging/homebrew/todo.rb.in").read_text()
          values = {"VERSION": version, "REPOSITORY": os.environ["GH_REPO"]}
          for key, target in {
              "MAC_ARM": "aarch64-apple-darwin",
              "MAC_INTEL": "x86_64-apple-darwin",
              "LINUX_ARM": "aarch64-unknown-linux-gnu",
              "LINUX_INTEL": "x86_64-unknown-linux-gnu",
          }.items():
              values[key] = Path(f"dist/todo-{version}-{target}.tar.gz.sha256").read_text().split()[0]
          for key, value in values.items():
              formula = formula.replace(f"@{key}@", value)
          Path("dist/todo.rb").write_text(formula)
          PY
      - name: Publish GitHub release
        run: gh release create "$TAG" dist/* --verify-tag --title "todo ${TAG#v}" --generate-notes
